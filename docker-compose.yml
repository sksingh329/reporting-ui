version: '3.9'

services:
  reporting-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reporting-ui
    env_file: .env
    ports:
      - "${HOST_PORT}:80"
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    name: ${BACKEND_NETWORK_NAME}
    external: true
