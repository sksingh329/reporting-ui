server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver — injected at container start via envsubst.
    # Local Podman: 10.89.0.1  |  Prod VM: 8.8.8.8
    resolver ${NGINX_DNS_RESOLVER} valid=30s ipv6=off;
    resolver_timeout 5s;

    # Proxy /api/* to the backend — URL and Host injected at container start.
    location /api/ {
        set $backend_upstream ${NGINX_BACKEND_URL};
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        # Required for TLS SNI when proxying to an HTTPS upstream (prod).
        proxy_ssl_server_name on;

        proxy_set_header Host ${NGINX_BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rewrite Set-Cookie domain so the httpOnly refresh-token cookie
        # issued by the backend is scoped to the frontend domain (prod only).
        proxy_cookie_domain ${NGINX_BACKEND_HOST} $host;
    }

    # SPA fallback — serve index.html for all client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
