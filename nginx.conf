server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Podman DNS inside this network namespace.
    # Resolve backend hostnames at request time so IP changes are picked up.
    resolver 10.89.0.1 valid=1s ipv6=off;
    resolver_timeout 2s;

    # Proxy all /api/* requests to the backend service.
    # The backend must be reachable as "reporting-server" on the same network.
    location /api/ {
        set $backend_upstream reporting-server:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
